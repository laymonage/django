name: Accessibility

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  accessibility:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Django core
        uses: actions/checkout@v5
      - name: Checkout Django admin demo
        uses: actions/checkout@v5
        with:
          repository: knyghty/django-admin-demo
          ref: a58fa374767a1904dbf0e45e9cc0df1cd2692838
          path: demo
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "demo/requirements.txt"
      - name: Install requirements
        run: pip install -r demo/requirements.txt
      - name: Run migrations
        run: python demo/manage.py migrate
      - name: Set up Node.js
        uses: actions/setup-node@v6
      - name: Install pa11y
        run: npm install -g pa11y-ci
      - name: Run the project
        run: python demo/manage.py runserver & sleep 10
      - name: Run Pa11y CI
        run: pa11y-ci
